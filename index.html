<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شؤون حرس الحدود - نظام الأرشفة والموافقة</title>
  
  <!-- الخطوط (Tajawal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة Tailwind CSS مع إعداد الخط الافتراضي -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'sans-serif'],
          },
        },
      },
    }
  </script>
  
  <!-- ملفات التنسيق المخصصة -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

  <!-- حاوية الإشعارات (Toasts) -->
  <div id="toastHost" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>
  
  <!-- الجذر الأساسي لتطبيق الواجهة -->
  <div id="appRoot" class="min-h-screen"></div>

  <!-- ملفات الجافاسكريبت الناتجة من "npm run build" -->
  <script src="dist/js/app.js"></script>
  <script src="dist/js/analyzer.js"></script>
  <script src="dist/js/archive.js"></script>
  <script src="dist/js/admin.js"></script>
</body>
</html>
